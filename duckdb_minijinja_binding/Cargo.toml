[package]
name = "duckdb_minijinja_binding"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "duckdb_minijinja_binding"
crate-type = ["staticlib"]

[dependencies]
minijinja = { version = "2.24.0", features = ["deserialization", "loader", "fuel", "json", "urlencode", "loop_controls"] }
# Only the deterministic contrib extras: the "datetime" and "rand" features (now(), random, ...) stay off so
# rendering remains a pure function of its inputs.
minijinja-contrib = { version = "2.24.0", features = ["pycompat", "wordcount", "wordwrap"] }
serde_json = "1.0.145"

# Grow the stack on demand while rendering deeply recursive templates (DuckDB worker threads can have small
# stacks, e.g. 512 KiB on macOS). Not available on wasm, where the runtime enforces its own limits.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
minijinja = { version = "2.24.0", features = ["stacker"] }
stacker = "0.1.15"
